AWSTemplateFormatVersion: "2010-09-09"
Description: Auri distributed Voice AI benchmark infrastructure

Parameters:
  WorkerImageUri:
    Type: String
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  SecurityGroupIds:
    Type: List<AWS::EC2::SecurityGroup::Id>
  BedrockModelId:
    Type: String
    Default: anthropic.claude-3-5-haiku-20241022-v1:0

Resources:
  AudioBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled

  RunsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: run_id
          AttributeType: S
      KeySchema:
        - AttributeName: run_id
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  RunDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600

  RunQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 900
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt RunDeadLetterQueue.Arn
        maxReceiveCount: 3

  BatchServiceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: batch.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSBatchServiceRole

  BatchExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  BatchJobRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: AuriWorkerDataPlane
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub "\${AudioBucket.Arn}/*"
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                  - dynamodb:PutItem
                Resource: !GetAtt RunsTable.Arn
              - Effect: Allow
                Action:
                  - transcribe:StartTranscriptionJob
                  - transcribe:GetTranscriptionJob
                Resource: "*"
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource: "*"
              - Effect: Allow
                Action:
                  - cloudwatch:PutMetricData
                Resource: "*"

  ComputeEnvironment:
    Type: AWS::Batch::ComputeEnvironment
    Properties:
      Type: MANAGED
      State: ENABLED
      ServiceRole: !GetAtt BatchServiceRole.Arn
      ComputeResources:
        Type: FARGATE
        MaxvCpus: 16
        Subnets: !Ref SubnetIds
        SecurityGroupIds: !Ref SecurityGroupIds

  JobQueue:
    Type: AWS::Batch::JobQueue
    Properties:
      Priority: 1
      State: ENABLED
      ComputeEnvironmentOrder:
        - Order: 1
          ComputeEnvironment: !Ref ComputeEnvironment

  JobDefinition:
    Type: AWS::Batch::JobDefinition
    Properties:
      Type: container
      PlatformCapabilities: [FARGATE]
      ContainerProperties:
        Image: !Ref WorkerImageUri
        ExecutionRoleArn: !GetAtt BatchExecutionRole.Arn
        JobRoleArn: !GetAtt BatchJobRole.Arn
        ResourceRequirements:
          - Type: VCPU
            Value: "1"
          - Type: MEMORY
            Value: "2048"
        Environment:
          - Name: AURI_AUDIO_BUCKET
            Value: !Ref AudioBucket
          - Name: AURI_RESULTS_BUCKET
            Value: !Ref AudioBucket
          - Name: AURI_RUNS_TABLE
            Value: !Ref RunsTable
          - Name: AURI_BEDROCK_MODEL_ID
            Value: !Ref BedrockModelId
        NetworkConfiguration:
          AssignPublicIp: ENABLED

  DispatcherRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: SubmitAuriBatchJobs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: batch:SubmitJob
                Resource: "*"

  DispatcherFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt DispatcherRole.Arn
      Timeout: 30
      Environment:
        Variables:
          AURI_BATCH_JOB_QUEUE: !Ref JobQueue
          AURI_BATCH_JOB_DEFINITION: !Ref JobDefinition
      Code:
        ZipFile: |
          import json, os, boto3
          batch = boto3.client("batch")
          def handler(event, context):
              failures = []
              for record in event.get("Records", []):
                  try:
                      payload = json.loads(record["body"])
                      run_id = payload["run_id"]
                      batch.submit_job(
                          jobName=f"auri-{run_id[:32]}",
                          jobQueue=os.environ["AURI_BATCH_JOB_QUEUE"],
                          jobDefinition=os.environ["AURI_BATCH_JOB_DEFINITION"],
                          containerOverrides={"environment": [{
                              "name": "AURI_JOB_PAYLOAD",
                              "value": json.dumps(payload)
                          }]}
                      )
                  except Exception:
                      failures.append({"itemIdentifier": record["messageId"]})
              return {"batchItemFailures": failures}

  QueueToDispatcher:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt RunQueue.Arn
      FunctionName: !Ref DispatcherFunction
      BatchSize: 5
      FunctionResponseTypes:
        - ReportBatchItemFailures

  ApiAccessPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: s3:PutObject
            Resource: !Sub "\${AudioBucket.Arn}/uploads/*"
          - Effect: Allow
            Action:
              - dynamodb:PutItem
              - dynamodb:GetItem
            Resource: !GetAtt RunsTable.Arn
          - Effect: Allow
            Action: sqs:SendMessage
            Resource: !GetAtt RunQueue.Arn

Outputs:
  AudioBucketName:
    Value: !Ref AudioBucket
  RunsTableName:
    Value: !Ref RunsTable
  RunQueueUrl:
    Value: !Ref RunQueue
  BatchJobQueue:
    Value: !Ref JobQueue
  BatchJobDefinition:
    Value: !Ref JobDefinition
  ApiAccessPolicyArn:
    Value: !Ref ApiAccessPolicy
