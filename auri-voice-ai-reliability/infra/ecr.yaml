AWSTemplateFormatVersion: "2010-09-09"
Description: ECR repository for Auri benchmark workers

Resources:
  WorkerRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: auri-benchmark-worker
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep the latest 10 images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 10
                },
                "action": {
                  "type": "expire"
                }
              }
            ]
          }

Outputs:
  WorkerRepositoryUri:
    Value: !GetAtt WorkerRepository.RepositoryUri
